name: Release builds

# Builds the Linux and macOS downloads and attaches them to an existing release. The network comes from that
# release's Windows zip, so every download plays the same generation.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v, e.g. 1.2.0
        required: true
      publish:
        description: Attach the downloads to the release (off to only build and test them)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  linux:
    # The oldest supported Ubuntu, so the download runs on distributions with an older C library.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-12

      - name: ONNX Runtime (CUDA 12 build) and the WebGPU plugin
        run: |
          curl -sSL -o ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.24.4/onnxruntime-linux-x64-gpu-1.24.4.tgz
          mkdir -p engine/third_party
          tar -xzf ort.tgz -C engine/third_party
          curl -sSL -o ep.nupkg https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime.EP.WebGpu/0.4.0
          mkdir -p engine/third_party/ep-webgpu-0.4.0
          unzip -q ep.nupkg -d engine/third_party/ep-webgpu-0.4.0

      - name: Engine
        working-directory: engine
        run: |
          cmake --preset linux -DCMAKE_CXX_COMPILER=g++-12
          cmake --build --preset linux
          ./build/linux/sixtests

      # The software Vulkan driver on 22.04 is too old for WebGPU, so this runs in a newer container.
      - name: WebGPU
        run: docker run --rm -v "$PWD/engine:/engine:ro" -v "$PWD/.github/webgpu-check.sh:/check.sh:ro" ubuntu:24.04 sh /check.sh

      - name: Network from the Windows download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${{ inputs.version }}" -R CixMango/Six --pattern '*windows-x64.zip' --dir net
          unzip -q net/*.zip -d net

      - name: Package
        working-directory: web
        run: |
          npm ci
          node scripts/package-release.mjs --net "$(ls -d ../net/Six/runs/rl/gen-*)/net.onnx" --version "${{ inputs.version }}"

      - name: Smoke test
        run: |
          tar -xzf web/release/Six-*-linux-x64.tar.gz -C /tmp
          cd /tmp/Six
          SIX_PORT=6690 SIX_ENGINE="$PWD/engine/sixengine" ./node/node web/src/server/main.mjs --prod &
          sleep 5
          curl -sf http://localhost:6690/api/bots | grep -q '"hexnet"'
          curl -sf -X POST http://localhost:6690/api/bot/turn -H 'content-type: application/json' \
            -d '{"moves":[[0,0],[1,0],[2,-1]],"radius":8,"bot":"hexnet","level":1}' | grep -q cells

      - name: Bare distributions (no graphics drivers, older libraries)
        run: |
          for image in ubuntu:22.04 debian:12 fedora:41 archlinux:latest; do
            echo "::group::$image"
            docker run --rm -v /tmp/Six:/six:ro -v "$PWD/.github/linux-check.sh:/check.sh:ro" "$image" sh /check.sh
            echo "::endgroup::"
          done

      - name: Attach to the release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ inputs.version }}" web/release/Six-*-linux-x64.tar.gz --clobber

  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build tools
        run: brew install ninja

      - name: ONNX Runtime and the WebGPU plugin
        run: |
          curl -sSL -o ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.24.4/onnxruntime-osx-arm64-1.24.4.tgz
          mkdir -p engine/third_party
          tar -xzf ort.tgz -C engine/third_party
          curl -sSL -o ep.nupkg https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime.EP.WebGpu/0.4.0
          mkdir -p engine/third_party/ep-webgpu-0.4.0
          unzip -q ep.nupkg -d engine/third_party/ep-webgpu-0.4.0

      - name: Engine
        working-directory: engine
        run: |
          cmake --preset mac
          cmake --build --preset mac
          ./build/mac/sixtests
          # WebGPU runs on Metal when the runner exposes a GPU; either way the network must play a move.
          (printf 'six\nisready\nposition radius 8 moves 0 0 1 0 2 -1\ngo movetime 3000\n'; sleep 30; echo quit) \
            | ./build/mac/sixengine --net tests/fixtures/tiny.onnx --webgpu 2>&1 | tee /tmp/webgpu.txt
          grep -q "^bestmove" /tmp/webgpu.txt

      - name: Network from the Windows download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${{ inputs.version }}" -R CixMango/Six --pattern '*windows-x64.zip' --dir net
          unzip -q net/*.zip -d net

      - name: Package
        working-directory: web
        run: |
          npm ci
          node scripts/package-release.mjs --net "$(ls -d ../net/Six/runs/rl/gen-*)/net.onnx" --version "${{ inputs.version }}"

      - name: Smoke test
        run: |
          ditto -x -k web/release/Six-*-macos-arm64.zip /tmp
          cd /tmp/Six
          SIX_PORT=6690 SIX_ENGINE="$PWD/engine/sixengine" ./node/node web/src/server/main.mjs --prod &
          sleep 5
          curl -sf http://localhost:6690/api/bots | grep -q '"hexnet"'
          curl -sf -X POST http://localhost:6690/api/bot/turn -H 'content-type: application/json' \
            -d '{"moves":[[0,0],[1,0],[2,-1]],"radius":8,"bot":"hexnet","level":1}' | grep -q cells

      - name: Attach to the release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ inputs.version }}" web/release/Six-*-macos-arm64.zip --clobber
